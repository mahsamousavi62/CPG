##################################################################################################  
variables:
- name: buildConfiguration
  value: 'Release /p:Version=$(Build.BuildId)'
- name: projectName
  value: CPG.API
##################################################################################################
steps:
- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: restore
    projects: '**/CPG.API.csproj'
    feedsToUse: config
    nugetConfigPath: nuget.config
##################################################################################################
- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    projects: '**/$(projectName).csproj'
    arguments: '--configuration $(BuildConfiguration) --no-restore'
##################################################################################################
- task: DotNetCoreCLI@2
  displayName: 'Unit Test'
  inputs:
    command: test
    projects: '**/*.Tests.Unit.csproj'
    arguments: '--configuration $(BuildConfiguration)'
##################################################################################################
- task: DotNetCoreCLI@2
  displayName: 'Integration Test'
  inputs:
    command: test
    projects: '**/**.Integration.csproj' 
    arguments: '--configuration $(BuildConfiguration)'
##################################################################################################
- task: DotNetCoreCLI@2
  displayName: Publish
  inputs:
    command: publish
    publishWebProjects: false
    projects: '**/$(projectName).csproj'
    arguments: '--configuration $(BuildConfiguration) --output src/$(projectName)/app'
    zipAfterPublish: false
    modifyOutputPath: false
##################################################################################################
- task: Docker@2
  displayName: buildAndPush
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
  inputs:
    containerRegistry: 'Charisma Docker Registry'
    repository: cpg-api/dev/cpg-api-backend
    Dockerfile: src/$(projectName)/Dockerfile
##################################################################################################
- task: Docker@2
  displayName: buildAndPush
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/stage')
  inputs:
    containerRegistry: 'Charisma Docker Registry'
    repository: cpg-api/stage/cpg-api-backend
    Dockerfile: src/$(projectName)/Dockerfile
##################################################################################################
- task: Docker@2
  displayName: buildAndPush
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
  inputs:
    containerRegistry: 'Charisma Docker Registry'
    repository: cpg-api/prod/cpg-api-backend
    Dockerfile: src/$(projectName)/Dockerfile
##################################################################################################